<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>bai 1 html</title>
        <style>
            .verdana { font-family: verdana; }
            .blue { color: blue; }
            .green { color: green; }
            .large { font-size: 40px; }
            .extra-large { font-size: 60px; }
        </style>
    </head>
    <body>
      Môn phát triển ứng dụng web+BTL
     <!-- cách dùng chú thích 2 cách
     c1:ctrl+k+c 
     c2:ctrl+/ -->
      <p> thẻ p là thẻ phân đoạn </p>
      <h1>thẻ h1</h1>
      <h2>thẻ h2</h2>
      <h3>thẻ h3</h3>
      <!-- thẻ h là thẻ định dạng đề mục -->
       <p>Môn web<br>Nhóm 03</p>
        <!-- thẻ div và span để phân chia đoạn  -->
     <div> đây là thẻ div</div>
     <span>đây là thẻ span</span>
     <b>thẻ b</b><br>
     <i>thẻ i</i><br>
     <u>thẻ u</u><br>
     <div>
        <span class="verdana">Môn phát triển ứng dụng web</span>
        <span class="blue">Nhóm 03</span>
        <span class="large">Tiết 1 2</span>
        <br>
        <span class="extra-large" style="color: green; font-family: arial;">trần thị yến nhi</span>
        
     </div>
    </body>
</html>
